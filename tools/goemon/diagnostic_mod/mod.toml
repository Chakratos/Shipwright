[manifest]
id = "chakratos_goemon_original_trace"
version = "0.4.0"
display_name = "Goemon Original Animation & Reference Trace"
description = "Opt-in original-game skeletal capture: real limb pointers, source display lists, per-frame animation matrices, plus original physics. Nothing is synthesized."
short_description = "In-game capture only; manually enable recording in Mod Settings."
authors = ["Chakratos Goemon port project"]
game_id = "mnsg"
minimum_recomp_version = "0.1.0"
dependencies = []
native_libraries = []

[inputs]
elf_path = "build/mod.elf"
mod_filename = "goemon_original_trace"
func_reference_syms_file = "Goemon64RecompSyms/mnsg.us.syms.toml"
data_reference_syms_files = ["Goemon64RecompSyms/mnsg.us.datasyms.toml"]
additional_files = []

[[manifest.config_options]]
id = "capture_enabled"
name = "Original-Daten aufnehmen"
description = "Im Spiel auf Aufnahme aktivieren stellen. Die Aufnahme beginnt erst bei deiner naechsten Stickbewegung. Aus stoppt die Aufnahme."
type = "Enum"
options = ["Aus", "Aufnahme aktivieren"]
default = "Aus"

[[manifest.config_options]]
id = "capture_animation"
name = "Original-Skelettanimationen aufnehmen"
description = "Erfasst echte Skelettglieder und Animationsmatrizen aus der Goemon64Recomp. Startet nach Stickbewegung. Maximal 1800 Spielupdates, kein ROM-Upload."
type = "Enum"
options = ["Aus", "Originalanimation aufnehmen"]
default = "Aus"
