name: Goemon ROM decoder portable tests

on:
  push:
    branches:
      - feature/goemon-original-controller
    paths:
      - "tools/goemon/re/**"
      - "soh/soh/Enhancements/Goemon/OriginalSourceRig.hpp"
      - "soh/soh/Enhancements/Goemon/OriginalAnimationStreams.hpp"
      - "soh/soh/Enhancements/Goemon/OriginalArticulatedFrame.hpp"
      - ".github/workflows/goemon-source-tests.yml"
  workflow_dispatch:

jobs:
  offline-codec-unit-tests:
    name: Source ROM codec tests (no game ROM, no self-hosted PC)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Python original source codec and F3DEX unit tests
        run: |
          set -euo pipefail
          python3 -m compileall -q tools/goemon
          python3 tools/goemon/re/tests/test_decode_original_limb_meshes.py
          python3 tools/goemon/re/tests/test_package_original_rig.py
          python3 tools/goemon/re/tests/test_analyze_original_animation_channels.py
          python3 tools/goemon/re/tests/test_archive_original_animation_streams.py
          python3 tools/goemon/re/tests/test_disasm_original_animation_mips.py
          python3 tools/goemon/re/tests/test_original_mips_animation_flow.py
          python3 tools/goemon/re/tests/test_original_n64_display_list_graph.py
          python3 tools/goemon/re/tests/test_offline_original_rigs.py
          python3 tools/goemon/re/tests/test_source_aligned_original_geometry.py
          python3 tools/goemon/re/tests/test_export_offline_original_poses.py
          python3 tools/goemon/re/tests/test_link_offline_bones_to_source_meshes.py
      - name: Native C++20 original source hierarchy/archive reader
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I. \
            tools/goemon/re/tests/test_original_source_rig.cpp \
            -o /tmp/goemon_source_rig_test
          /tmp/goemon_source_rig_test
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I. \
            tools/goemon/re/tests/test_original_animation_streams.cpp \
            -o /tmp/goemon_animation_stream_test
          /tmp/goemon_animation_stream_test
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I. \
            tools/goemon/re/tests/test_original_articulated_frame.cpp \
            -o /tmp/goemon_articulated_frame_test
          /tmp/goemon_articulated_frame_test
          # Verify the actual file-format boundary rather than only
          # testing each component with independent in-memory fixtures.
          python3 tools/goemon/re/tests/make_synthetic_articulated_fixtures.py \
            --output-dir /tmp/goemon_source_animation_fixtures
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I. \
            tools/goemon/re/tests/test_original_articulated_e2e.cpp \
            -o /tmp/goemon_articulated_e2e
          /tmp/goemon_articulated_e2e \
            /tmp/goemon_source_animation_fixtures/synthetic.goskel \
            /tmp/goemon_source_animation_fixtures/synthetic.gopa
      - name: Confirm no copyrighted assets generated or uploaded
        run: |
          echo "Synthetic tests only. No original ROM, mesh, image, NRM or artifacts."
