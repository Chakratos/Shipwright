name: goemon-selfhosted

on:
  push:
    branches:
      - feature/goemon-original-controller
    paths:
      - '.github/workflows/goemon-selfhosted.yml'
      - 'soh/soh/Enhancements/Goemon/**'
      - 'soh/soh/SohGui/SohMenuDevTools.cpp'
      - 'soh/src/overlays/actors/ovl_player_actor/z_player.c'
      - 'tools/goemon/**'
  workflow_dispatch:
    inputs:
      full_build:
        description: 'Build Ship (or use [goemon-build] in a push commit message)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: goemon-selfhosted-${{ github.ref }}-${{ ((github.event_name == 'workflow_dispatch' && inputs.full_build) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[goemon-build]'))) && 'full' || 'fast' }}
  cancel-in-progress: true

jobs:
  goemon-windows:
    name: Goemon fast regression tests (optional full Windows build)
    runs-on: [self-hosted, Windows, X64, goemon]
    timeout-minutes: 150
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          # Preserve incremental CMake output across self-hosted runs:
          # a full build should only compile changed sources next time.
          clean: false
          submodules: ${{ ((github.event_name == 'workflow_dispatch' && inputs.full_build) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[goemon-build]'))) && 'recursive' || 'false' }}
          persist-credentials: false

      # Normal pushes: fast tests only. The literal [goemon-build] marker
      # explicitly opts a single commit into the cached full Windows build.
      - name: Goemon Python and C++20 tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $llvm = 'C:\Program Files\LLVM\bin'
          if (Test-Path (Join-Path $llvm 'clang++.exe')) {
            $env:PATH = "$llvm;$env:PATH"
          }
          if (Get-Command py -ErrorAction SilentlyContinue) {
            & py -3 tools\goemon\verify.py --native
          } elseif (Get-Command python -ErrorAction SilentlyContinue) {
            & python tools\goemon\verify.py --native
          } else {
            throw 'Python 3 ist fuer das Windows-Dienstkonto nicht erreichbar.'
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Goemon-Tests fehlgeschlagen: $LASTEXITCODE"
          }

      - name: Prepare original N64 model references locally
        # Opt-in, one-time fetch of the publicly available static OBJ rips.
        # Nothing is published as a GitHub artifact or committed to git.
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[goemon-models]') }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = 'C:\\actions-runner-goemon\\character-models'
          & py -3 tools\\goemon\\re\\prepare_reference_models.py --output-dir $destination
          if ($LASTEXITCODE -ne 0) {
            throw "Lokaler Originalmodell-Import fehlgeschlagen: $LASTEXITCODE"
          }
          Write-Host "Vier lokale Goemon-Meshes vorbereitet: $destination"
          Write-Host 'Keine Modell- oder Texturdateien werden hochgeladen.'

      - name: Configure and build Ship of Harkinian
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.full_build) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[goemon-build]'))) }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cm = Get-Command cmake -ErrorAction SilentlyContinue
          $cmake = if ($cm) { $cm.Source } else { 'C:\Program Files\CMake\bin\cmake.exe' }
          if (-not (Test-Path $cmake)) {
            throw 'CMake ist fuer das Runner-Dienstkonto nicht erreichbar.'
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'Visual Studio 2022 Build Tools fehlen (vswhere.exe nicht gefunden).'
          }
          $vs = & $vswhere -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath -latest
          $vsVersion = & $vswhere -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion -latest
          if (-not $vs -or -not $vsVersion) {
            throw 'Visual Studio mit MSVC und Windows SDK ist erforderlich.'
          }
          $vsMajor = ([version]$vsVersion).Major
          $generator = switch ($vsMajor) {
            18 { 'Visual Studio 18 2026' }
            17 { 'Visual Studio 17 2022' }
            default { throw "Nicht unterstuetzte Visual Studio Version: $vsVersion" }
          }
          Write-Host "Visual Studio: $vs ($vsVersion) / CMake generator: $generator"
          & $cmake -S . -B build\goemon-ci -G $generator -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake-Konfiguration fehlgeschlagen: $LASTEXITCODE" }
          & $cmake --build build\goemon-ci --config Release --target GenerateSohOtr --parallel 8
          if ($LASTEXITCODE -ne 0) { throw "Ship-Asset-Build fehlgeschlagen: $LASTEXITCODE" }
          & $cmake --build build\goemon-ci --config Release --target soh --parallel 8
          if ($LASTEXITCODE -ne 0) { throw "Ship-C++-Build fehlgeschlagen: $LASTEXITCODE" }

      - name: Verify local executable and engine assets
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.full_build) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[goemon-build]'))) }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'x64\Release\soh.exe'
          $assets = Join-Path $PWD 'build\goemon-ci\soh\soh.o2r'
          if (-not (Test-Path $exe -PathType Leaf)) { throw "Lokale Ship-EXE nicht gefunden: $exe" }
          if (-not (Test-Path $assets -PathType Leaf)) { throw "Lokale Ship-Ressourcen nicht gefunden: $assets" }
          Write-Host "Windows-Build bleibt lokal auf diesem PC; kein Upload nach GitHub."
          Write-Host "EXE: $exe"
          Write-Host "Ressourcen: $assets"

