name: goemon-selfhosted

on:
  push:
    branches:
      - feature/goemon-original-controller
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goemon-selfhosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goemon-windows:
    name: Goemon regression tests and Ship Windows build
    runs-on: [self-hosted, Windows, X64, goemon]
    timeout-minutes: 150
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Goemon Python and C++20 tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $llvm = 'C:\Program Files\LLVM\bin'
          if (Test-Path (Join-Path $llvm 'clang++.exe')) {
            $env:PATH = "$llvm;$env:PATH"
          }
          if (Get-Command py -ErrorAction SilentlyContinue) {
            & py -3 tools\goemon\verify.py --native
          } elseif (Get-Command python -ErrorAction SilentlyContinue) {
            & python tools\goemon\verify.py --native
          } else {
            throw 'Python 3 ist fuer das Windows-Dienstkonto nicht erreichbar.'
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Goemon-Tests fehlgeschlagen: $LASTEXITCODE"
          }

      - name: Configure and build Ship of Harkinian
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cm = Get-Command cmake -ErrorAction SilentlyContinue
          $cmake = if ($cm) { $cm.Source } else { 'C:\Program Files\CMake\bin\cmake.exe' }
          if (-not (Test-Path $cmake)) {
            throw 'CMake ist fuer das Runner-Dienstkonto nicht erreichbar.'
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'Visual Studio 2022 Build Tools fehlen (vswhere.exe nicht gefunden).'
          }
          $vs = & $vswhere -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath -latest
          if (-not $vs) {
            throw 'Visual Studio 2022 mit MSVC v143 und Windows SDK ist erforderlich.'
          }
          Write-Host "VS 2022: $vs"
          & $cmake -S . -B build\goemon-ci -G 'Visual Studio 17 2022' -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake-Konfiguration fehlgeschlagen: $LASTEXITCODE" }
          & $cmake --build build\goemon-ci --config Release --target GenerateSohOtr --parallel 8
          if ($LASTEXITCODE -ne 0) { throw "Ship-Asset-Build fehlgeschlagen: $LASTEXITCODE" }
          & $cmake --build build\goemon-ci --config Release --target soh --parallel 8
          if ($LASTEXITCODE -ne 0) { throw "Ship-C++-Build fehlgeschlagen: $LASTEXITCODE" }
