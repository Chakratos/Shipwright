name: goemon-selfhosted

on:
  push:
    branches:
      - feature/goemon-original-controller
    paths:
      - '.github/workflows/goemon-selfhosted.yml'
      - 'soh/soh/Enhancements/Goemon/**'
      - 'soh/soh/SohGui/SohMenuDevTools.cpp'
      - 'soh/src/overlays/actors/ovl_player_actor/z_player.c'
      - 'tools/goemon/**'
  workflow_dispatch:
    inputs:
      full_build:
        description: 'Build Ship (or use [goemon-build] in a push commit message)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: goemon-selfhosted-${{ github.ref }}-${{ ((github.event_name == 'workflow_dispatch' && inputs.full_build) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[goemon-build]'))) && 'full' || 'fast' }}
  cancel-in-progress: true

jobs:
  goemon-windows:
    name: Goemon fast regression tests (optional full Windows build)
    runs-on: [self-hosted, Windows, X64, goemon]
    timeout-minutes: 150
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          # Preserve incremental CMake output across self-hosted runs:
          # a full build should only compile changed sources next time.
          clean: false
          submodules: ${{ ((github.event_name == 'workflow_dispatch' && inputs.full_build) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[goemon-build]'))) && 'recursive' || 'false' }}
          persist-credentials: false

      # Normal pushes: fast tests only. The literal [goemon-build] marker
      # explicitly opts a single commit into the cached full Windows build.
      - name: Goemon Python and C++20 tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $llvm = 'C:\Program Files\LLVM\bin'
          if (Test-Path (Join-Path $llvm 'clang++.exe')) {
            $env:PATH = "$llvm;$env:PATH"
          }
          if (Get-Command py -ErrorAction SilentlyContinue) {
            & py -3 tools\goemon\verify.py --native
          } elseif (Get-Command python -ErrorAction SilentlyContinue) {
            & python tools\goemon\verify.py --native
          } else {
            throw 'Python 3 ist fuer das Windows-Dienstkonto nicht erreichbar.'
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Goemon-Tests fehlgeschlagen: $LASTEXITCODE"
          }

      - name: Prepare original N64 model references locally
        # Opt-in, local-only preparation of browser-downloaded OBJ ZIPs.
        # Direct automated website requests return HTTP 403; never retry
        # an unauthorized CDN download as a background job.
        # Nothing is published as a GitHub artifact or committed to git.
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[goemon-models]') }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = 'C:\actions-runner-goemon\character-models'
          & py -3 tools\goemon\re\prepare_reference_models.py --output-dir $destination --download-dir 'C:\Users\Chakratos\Downloads' --offline
          if ($LASTEXITCODE -ne 0) {
            throw "Lokaler Originalmodell-Import fehlgeschlagen: $LASTEXITCODE"
          }
          Write-Host "Vier lokale Goemon-Meshes vorbereitet: $destination"
          Write-Host 'Keine Modell- oder Texturdateien werden hochgeladen.'

      - name: Export owned original N64 character geometry locally
        # This decodes source-ROM F3DEX vertex data into independent OBJ
        # parts for rig linking. No copyrighted bytes are uploaded to GitHub.
        # Keep this work outside the checkout and separate Goemon test game.
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[goemon-rom-export]') }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'C:\actions-runner-goemon\original-rom-meshes-source-aligned'
          & py -3 tools\goemon\re\export_original_models.py --output-dir $dest
          if ($LASTEXITCODE -ne 0) {
            throw "Original-ROM-Mesh-Export fehlgeschlagen: $LASTEXITCODE"
          }
          Write-Host "Quellzugeordnete Original-Grafikabschnitte liegen lokal: $dest"
          Write-Host "Keine ROM-, OBJ- oder Texturdateien werden hochgeladen."

      - name: Build original Goemon skeleton animation capture mod locally
        # Runs only when explicitly selected in commit message.
        # Builds a MIPS .nrm probe against local cached tools and decomp sources.
        # The probe writes original poses only when the player enables
        # "Original-Skelettanimationen aufnehmen" inside the original game.
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[goemon-animation-mod]') }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & "$PWD\tools\goemon\diagnostic_mod\build_windows.ps1" -NoInstall
          if ($LASTEXITCODE -ne 0) {
            throw "Original Goemon Animations-Capture-Mod Build fehlgeschlagen: $LASTEXITCODE"
          }
          $workspace = Join-Path (Split-Path $PWD -Parent) 'GoemonTraceModBuild'
          $source = Join-Path $workspace 'build\goemon_original_trace.nrm'
          if (-not (Test-Path $source -PathType Leaf)) {
            throw "Original-MIPS-Capture-Mod nicht gebaut: $source"
          }
          $localOut = 'C:\actions-runner-goemon\original-animation-capture'
          New-Item -ItemType Directory -Force -Path $localOut | Out-Null
          Copy-Item -LiteralPath $source -Destination (Join-Path $localOut 'goemon_original_trace.nrm') -Force
          # Runner runs as NetworkService. The interactive user's AppData
          # may be inaccessible, even though compilation succeeded.
          # Stage the compiled NRM where the local user can access it.
          $desktopTest = 'C:\Users\Chakratos\Desktop\SoH Goemon Test'
          try {
            if (Test-Path -LiteralPath $desktopTest -PathType Container -ErrorAction Stop) {
              Copy-Item -LiteralPath $source -Destination (Join-Path $desktopTest 'goemon_original_trace.nrm') -Force -ErrorAction Stop
              Write-Host "Original-Skelett-Capture-Mod auf dem Desktop bereitgestellt: $desktopTest"
              $launcher = Join-Path $PWD 'tools\goemon\diagnostic_mod\Goemon_Originalanimation_aufnehmen.cmd'
              if (Test-Path $launcher -PathType Leaf) {
                Copy-Item -LiteralPath $launcher -Destination (Join-Path $desktopTest 'Goemon_Originalanimation_aufnehmen.cmd') -Force -ErrorAction Stop
                Write-Host "Ein-Klick Originalanimations-Aufnahme auf dem Desktop bereitgestellt."
              }
            }
          } catch {
            Write-Warning "Desktop-Ablage nicht zugreifbar: $_"
          }
          $interactiveMods = 'C:\Users\Chakratos\AppData\Local\Goemon64Recompiled\mods'
          try {
            if (Test-Path -LiteralPath $interactiveMods -PathType Container -ErrorAction Stop) {
              Copy-Item -LiteralPath $source -Destination (Join-Path $interactiveMods 'goemon_original_trace.nrm') -Force -ErrorAction Stop
              Write-Host "Original-Skelett-Capture-Mod in Original-Goemon installiert: $interactiveMods"
            }
          } catch {
            Write-Host "Runner kann private AppData nicht lesen; NRM liegt stattdessen auf dem Desktop und in $localOut"
          }
          Write-Host 'Keine Original-ROM-, Mesh- oder Animationsdateien hochgeladen.'

      - name: Export original ROM skeletal poses offline to local PC
        # Original authored Skeleton records only; no original game launch.
        # Activated only for an explicit one-shot commit marker.
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[goemon-offline-poses]') }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'C:\actions-runner-goemon\original-rom-poses'
          & py -3 tools\goemon\re\export_offline_original_poses.py --output-dir $dest
          if ($LASTEXITCODE -ne 0) {
            throw "Original ROM Skeleton-Posen konnten nicht offline extrahiert werden (Exit $LASTEXITCODE)"
          }
          if (-not (Test-Path (Join-Path $dest 'catalog_summary.json') -PathType Leaf)) {
            throw 'Original ROM Posenkatalog nach Extraktion nicht vorhanden'
          }
          Write-Host "Original-Posen stehen lokal: $dest"
          Write-Host 'Ohne Spielstart, ohne manuelle Aufnahme und ohne GitHub-Artifact-Upload.'

      - name: Link source-ROM skeletal limbs to corrected N64 graphics
        # Reads only previously exported local original ROM-derived data.
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[goemon-bone-link]') }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'C:\actions-runner-goemon\original-rom-poses\original_bone_mesh_links.json'
          & py -3 tools\goemon\re\link_offline_bones_to_source_meshes.py --output $out
          if ($LASTEXITCODE -ne 0) {
            throw "Original ROM bone-to-Gfx linking failed: $LASTEXITCODE"
          }
          Write-Host "Original limb-to-ROM-graphics links saved locally: $out"
          Write-Host 'No original game launch, no external model downloads, no asset uploads.'

      - name: Trace original N64 skeletal DisplayLists into ROM geometry
        # Full F3DEX calls from source-authored Skeleton gfx pointers;
        # no GUI, no capture, no screenshot, no asset uploads.
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[goemon-gfx-trace]') }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'C:\actions-runner-goemon\original-rom-poses\original_recursive_gfx_links.json'
          & py -3 tools\goemon\re\trace_original_bone_display_lists.py --output $out
          if ($LASTEXITCODE -ne 0) {
            throw "Original original ROM F3DEX child display-list linking failed: $LASTEXITCODE"
          }
          Write-Host "Original-animierte-Skelettglieder mit echten N64 Gfx-Spans lokal: $out"

      - name: Find original Goemon animation action pointers in ROM
        # Read main code data and source-verified original pose headers.
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[goemon-action-pointers]') }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'C:\actions-runner-goemon\original-rom-poses\original_action_pointer_tables.json'
          & py -3 tools\goemon\re\offline_animation_action_pointers.py --output $out
          if ($LASTEXITCODE -ne 0) {
            throw "Original Goemon animation pointer table scan failed: $LASTEXITCODE"
          }
          Write-Host "Original ROM animation dispatch table analysis local: $out"

      - name: Extract original skeleton-owned limb 3D meshes
        # Writes real source-ROM per-limb geometry to owner's Windows PC only.
        if: ${{ always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[goemon-rig-limbs]') }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & py -3 tools\goemon\re\export_original_rig_limbs.py
          if ($LASTEXITCODE -ne 0) {
            throw "Original source ROM limb decoding failed: $LASTEXITCODE"
          }
          Write-Host 'Original per-body-part ROM meshes stored in C:\actions-runner-goemon\original-rig-limbs'

      - name: Decode original animation MIPS and archive compressed ROM streams
        # Both input and outputs stay on the private Windows runner.
        # Log contains ONLY high-level instruction metadata, no ROM bytes.
        if: ${{ always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[goemon-animation-codec]') }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & py -3 tools\goemon\re\disasm_original_animation_mips.py
          if ($LASTEXITCODE -ne 0) {
            throw "Original N64 MIPS animation evaluator decode failed: $LASTEXITCODE"
          }
          & py -3 tools\goemon\re\archive_original_animation_streams.py
          if ($LASTEXITCODE -ne 0) {
            throw "Original ROM animation byte-stream extraction failed: $LASTEXITCODE"
          }
          Write-Host 'Original MIPS algorithm: C:\actions-runner-goemon\original-animation-mips'
          Write-Host 'Actual source animation streams: C:\actions-runner-goemon\original-animation-streams'
          Write-Host 'No gameplay recording, manual assets, or GitHub uploads.'

      - name: Package genuine original character rig data locally
        # Preserve exact decoded N64 limb meshes plus raw Skeleton channel words.
        # The 261 structures are unverified descriptors, NOT animation frames.
        if: ${{ always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[goemon-rig-package]') }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & py -3 tools\goemon\re\package_original_rig.py
          if ($LASTEXITCODE -ne 0) {
            throw "Original ROM GOSKEL01 package generation failed: $LASTEXITCODE"
          }
          $manifest = 'C:\actions-runner-goemon\original-rom-rigs\manifest.json'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
            throw "Original local rig archive manifest missing: $manifest"
          }
          Write-Host "Original articulated rig packages available locally: $manifest"
          Write-Host 'No source ROM assets or geometry uploaded.'

      - name: Stage source-ROM rig assets in isolated Goemon test installation
        # Local-to-local only: original game assets must never enter GitHub.
        # Does NOT modify the existing SoH AP / Archipelago installation.
        if: ${{ always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[goemon-rig-package]') }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $test = 'C:\Users\Chakratos\Desktop\SoH Goemon Test'
          if (-not (Test-Path -LiteralPath $test -PathType Container)) {
            Write-Host "No isolated Goemon test folder at $test; source assets remain in local runner directories."
            exit 0
          }
          $sources = 'C:\actions-runner-goemon\original-rom-rigs'
          $animation = 'C:\actions-runner-goemon\original-animation-streams'
          $counter = 0
          foreach ($character in @('Goemon', 'Ebisumaru', 'Sasuke')) {
            $to = Join-Path (Join-Path $test 'character-original') $character
            $rig = Join-Path (Join-Path $sources $character) 'original.goskel'
            $anim = Join-Path (Join-Path $animation $character) 'original.goanim'
            if ((Test-Path -LiteralPath $rig -PathType Leaf) -or (Test-Path -LiteralPath $anim -PathType Leaf)) {
              New-Item -ItemType Directory -Force -Path $to | Out-Null
              if (Test-Path -LiteralPath $rig -PathType Leaf) {
                Copy-Item -LiteralPath $rig -Destination (Join-Path $to 'original.goskel') -Force
                $counter++
              }
              if (Test-Path -LiteralPath $anim -PathType Leaf) {
                Copy-Item -LiteralPath $anim -Destination (Join-Path $to 'original.goanim') -Force
                $counter++
              }
            }
          }
          Write-Host "Original ROM-only character asset files staged locally: $counter"
          Write-Host 'Original MIPS animation codec still required before gameplay playback; no fake animation enabled.'

      - name: Configure and build Ship of Harkinian
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.full_build) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[goemon-build]'))) }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cm = Get-Command cmake -ErrorAction SilentlyContinue
          $cmake = if ($cm) { $cm.Source } else { 'C:\Program Files\CMake\bin\cmake.exe' }
          if (-not (Test-Path $cmake)) {
            throw 'CMake ist fuer das Runner-Dienstkonto nicht erreichbar.'
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'Visual Studio 2022 Build Tools fehlen (vswhere.exe nicht gefunden).'
          }
          $vs = & $vswhere -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath -latest
          $vsVersion = & $vswhere -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion -latest
          if (-not $vs -or -not $vsVersion) {
            throw 'Visual Studio mit MSVC und Windows SDK ist erforderlich.'
          }
          $vsMajor = ([version]$vsVersion).Major
          $generator = switch ($vsMajor) {
            18 { 'Visual Studio 18 2026' }
            17 { 'Visual Studio 17 2022' }
            default { throw "Nicht unterstuetzte Visual Studio Version: $vsVersion" }
          }
          Write-Host "Visual Studio: $vs ($vsVersion) / CMake generator: $generator"
          & $cmake -S . -B build\goemon-ci -G $generator -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake-Konfiguration fehlgeschlagen: $LASTEXITCODE" }
          & $cmake --build build\goemon-ci --config Release --target GenerateSohOtr --parallel 8
          if ($LASTEXITCODE -ne 0) { throw "Ship-Asset-Build fehlgeschlagen: $LASTEXITCODE" }
          & $cmake --build build\goemon-ci --config Release --target soh --parallel 8
          if ($LASTEXITCODE -ne 0) { throw "Ship-C++-Build fehlgeschlagen: $LASTEXITCODE" }

      - name: Verify local executable and engine assets
        if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.full_build) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[goemon-build]'))) }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'x64\Release\soh.exe'
          $assets = Join-Path $PWD 'build\goemon-ci\soh\soh.o2r'
          if (-not (Test-Path $exe -PathType Leaf)) { throw "Lokale Ship-EXE nicht gefunden: $exe" }
          if (-not (Test-Path $assets -PathType Leaf)) { throw "Lokale Ship-Ressourcen nicht gefunden: $assets" }
          Write-Host "Windows-Build bleibt lokal auf diesem PC; kein Upload nach GitHub."
          Write-Host "EXE: $exe"
          Write-Host "Ressourcen: $assets"
          # Only the separate Goemon test installation. Archipelago stays untouched.
          $testGame = 'C:\Users\Chakratos\Desktop\SoH Goemon Test'
          if (Test-Path $testGame -PathType Container) {
            try {
              Copy-Item -LiteralPath $exe -Destination (Join-Path $testGame 'soh.exe') -Force -ErrorAction Stop
              Copy-Item -LiteralPath $assets -Destination (Join-Path $testGame 'soh.o2r') -Force -ErrorAction Stop
              Write-Host "Goemon-Testinstallation mit dem neuen lokalen Build aktualisiert: $testGame"
            } catch {
              Write-Warning "Lokaler Build erfolgreich, Testinstallation vermutlich noch geoeffnet: $_"
              Write-Warning "Nach dem Schliessen des Spiels EXE und soh.o2r vom Runner kopieren."
            }
          } else {
            Write-Host "Separate Testinstallation nicht gefunden: $testGame; fertiger Build bleibt im Runner-Verzeichnis."
          }

